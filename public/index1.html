<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evening Todos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- In React: this whole <div className="app"> becomes your <App /> component -->
  <div class="app">
    <header class="header">
      <h1>Evening todos</h1>
      <p class="subtitle">Settle in and sort out what's left for today.</p>
    </header>

    <!-- Add form: id is generated in code, so it has no input -->
    <form class="add-form" aria-label="Add a todo">
      <div class="field field-title">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" placeholder="Water the plants" required />
      </div>

      <div class="field field-user">
        <label for="userId">User ID</label>
        <input id="userId" name="userId" type="number" min="1" value="1" required />
      </div>

      <label class="check" for="completed">
        <input id="completed" name="completed" type="checkbox" />
        <span class="check-box" aria-hidden="true"></span>
        Already done
      </label>

      <button type="submit" class="btn">Add todo</button>
    </form>

    <!-- List: map your todos array to <li> items -->
    <section aria-label="Todo list">
      <p class="count">3 todos, 1 done</p>

      <ul class="todo-list">
        <li class="todo">
          <label class="check">
            <input type="checkbox" aria-label="Mark complete" />
            <span class="check-box" aria-hidden="true"></span>
          </label>
          <div class="todo-body">
            <p class="todo-title">Water the plants</p>
            <p class="todo-meta"><span class="badge">User 1</span><span class="badge">ID 1</span></p>
          </div>
          <button class="icon-btn" aria-label="Delete todo">&times;</button>
        </li>

        <li class="todo is-done">
          <label class="check">
            <input type="checkbox" checked aria-label="Mark incomplete" />
            <span class="check-box" aria-hidden="true"></span>
          </label>
          <div class="todo-body">
            <p class="todo-title">Brew a pot of tea</p>
            <p class="todo-meta"><span class="badge">User 1</span><span class="badge">ID 2</span></p>
          </div>
          <button class="icon-btn" aria-label="Delete todo">&times;</button>
        </li>

        <li class="todo">
          <label class="check">
            <input type="checkbox" aria-label="Mark complete" />
            <span class="check-box" aria-hidden="true"></span>
          </label>
          <div class="todo-body">
            <p class="todo-title">Reply to the landlord</p>
            <p class="todo-meta"><span class="badge">User 2</span><span class="badge">ID 3</span></p>
          </div>
          <button class="icon-btn" aria-label="Delete todo">&times;</button>
        </li>
      </ul>

      <!-- Show when the array is empty -->
      <p class="empty" hidden>Nothing here yet. Add your first todo above.</p>
    </section>
  </div>
</body>
</html>
